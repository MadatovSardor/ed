name: ed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ed_db
      POSTGRES_USER: user_ed
      POSTGRES_PASSWORD: root123
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_ed -d ed_db"]
      interval: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kc_db
      POSTGRES_USER: user_keycloak
      POSTGRES_PASSWORD: root123
    volumes: ["kcdb:/var/lib/postgresql/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: root123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/kc_db
      KC_DB_USERNAME: user_keycloak
      KC_DB_PASSWORD: root123
      KC_HTTP_PORT: 8081
    ports: ["8081:8081"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import"]
    depends_on: [keycloak-db]

  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL - boshqa containerlar uchun (kafka:29092), EXTERNAL - host uchun (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["9092:9092"]
    volumes: ["kafka:/var/lib/kafka/data"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: ed
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports: ["8082:8080"]
    depends_on: [kafka]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ed_rabbit_user
      RABBITMQ_DEFAULT_PASS: root123
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbit:/var/lib/rabbitmq"]

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: ["redis:/data"]

volumes:
  pg: {}
  kcdb: {}
  kafka: {}
  rabbit: {}
  redis: {}